[package]
name = "scb-runner"
version = "0.1.0"
edition = "2021"
description = "SealedCodeBounty verifier runner: flag derivation, submission gating, safe unpacking, sandboxed exploit execution, signed verdicts."
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"
tar = "0.4"
flate2 = "1"
crypto_box = { version = "0.9", features = ["seal"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true

[workspace]
